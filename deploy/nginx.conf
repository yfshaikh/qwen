# Serves the built Engram SPA and reverse-proxies the API + /voice WebSocket to
# the backend FastAPI service (Docker service name "backend", port 8050).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API paths (incl. SSE streams). Prefix-matched so /chat, /memory/status,
    # /insights/... etc. all route to the backend.
    location ~ ^/(chat|graph|consolidate|audit|health|sessions|memory|eval|insights)(/|$) {
        proxy_pass http://backend:8050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-Sent Events / streaming responses: don't buffer or time out.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Voice pipeline WebSocket — needs the HTTP/1.1 Upgrade dance.
    location /voice {
        proxy_pass http://backend:8050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA fallback — everything else serves index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
